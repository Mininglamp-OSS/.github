# Octo security suite: weekly CodeQL + per-PR dependency review + secret scan.
# Requires: Dependency Graph enabled (Settings → Code security).
# Set `language` below to: go | javascript-typescript | java-kotlin
name: Security

on:
  pull_request:
    branches: [ $default-branch ]
  push:
    branches: [ $default-branch ]
  schedule:
    - cron: "0 6 * * 1"   # weekly CodeQL, Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: Mininglamp-OSS/.github/.github/workflows/reusable-codeql.yml@v1
    with:
      language: go
    permissions:
      actions: read
      contents: read
      security-events: write

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: Mininglamp-OSS/.github/.github/workflows/reusable-dependency-review.yml@v1
    permissions:
      contents: read
      pull-requests: write

  secret-scan:
    if: github.event_name != 'schedule'
    uses: Mininglamp-OSS/.github/.github/workflows/reusable-secret-scan.yml@v1
    permissions:
      contents: read
