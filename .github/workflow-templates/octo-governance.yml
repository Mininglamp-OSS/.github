# Octo repo governance: orphan-history check, PR title lint (Conventional Commits),
# PR size/dependency labeler, and stale issue/PR sweep.
name: Governance

on:
  pull_request:
    branches: [ $default-branch ]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  history:
    if: github.event_name == 'pull_request'
    uses: Mininglamp-OSS/.github/.github/workflows/reusable-history-check.yml@v1
    permissions:
      contents: read

  pr-title-lint:
    if: github.event_name == 'pull_request_target'
    uses: Mininglamp-OSS/.github/.github/workflows/reusable-pr-title-lint.yml@v1
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_title: ${{ github.event.pull_request.title }}
      repo_owner: ${{ github.event.repository.owner.login }}
      repo_name: ${{ github.event.repository.name }}
    permissions:
      pull-requests: write

  labeler:
    if: github.event_name == 'pull_request_target'
    uses: Mininglamp-OSS/.github/.github/workflows/reusable-pr-labeler.yml@v1
    with:
      pr_number: ${{ github.event.pull_request.number }}
      repo_owner: ${{ github.repository_owner }}
      repo_name: ${{ github.event.repository.name }}
    permissions:
      issues: write
      pull-requests: write

  stale:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: Mininglamp-OSS/.github/.github/workflows/reusable-stale.yml@v1
    permissions:
      issues: write
      pull-requests: write
