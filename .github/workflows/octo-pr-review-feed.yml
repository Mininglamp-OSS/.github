name: Octo PR Review Feed (reusable)

on:
  workflow_call:
    inputs:
      repo_name:
        type: string
        required: true
      pr_number:
        type: number
        required: true
      pr_title:
        type: string
        required: true
      pr_url:
        type: string
        required: true
      pr_author:
        type: string
        required: true
      event_action:
        type: string
        required: true
      project_group_id:
        type: string
        required: true
      api_base_url:
        type: string
        required: false
        default: 'https://im.deepminer.com.cn/api'
    secrets:
      OCTO_BOT_TOKEN:
        required: true

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send review notification
        env:
          OCTO_BOT_TOKEN: ${{ secrets.OCTO_BOT_TOKEN }}
          REPO_NAME: ${{ inputs.repo_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          EVENT_ACTION: ${{ inputs.event_action }}
          PROJECT_GROUP_ID: ${{ inputs.project_group_id }}
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import re
          import sys
          import time
          import urllib.request
          import urllib.error

          ALLOWED_ACTIONS = {"opened", "ready_for_review", "review_requested", "synchronize"}

          def require_env(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  print(f"::error::Missing required env var: {name}")
                  sys.exit(1)
              return value

          def require_group_id(name):
              val = os.environ.get(name, '').strip()
              if not val:
                  print(f'ERROR: required env var {name} is missing')
                  sys.exit(2)
              if not re.fullmatch(r'[0-9a-f]{32}', val):
                  print(f'ERROR: {name} must be a 32-char lowercase hex group id')
                  sys.exit(2)
              return val

          def require_repo_name(name):
              val = os.environ.get(name, '').strip()
              if not val:
                  print(f'ERROR: required env var {name} is missing')
                  sys.exit(2)
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,99}', val) or val in {'.', '..'}:
                  print(f'ERROR: {name} contains invalid characters: {val!r}')
                  sys.exit(2)
              return val

          def sanitize_text(s, max_len=300):
              s = str(s or '')
              s = re.sub(r'[\x00-\x1f\x7f]', ' ', s)
              return s[:max_len]

          def send_message(api_base_url, token, group_id, content, failed, retries=3):
              url = f"{api_base_url}/v1/bot/sendMessage"
              payload = json.dumps({'channel_id': group_id, 'channel_type': 2, 'payload': {'type': 1, 'content': content}}).encode()
              headers = {
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {token}"
              }
              last_err = None
              for attempt in range(1, retries + 1):
                  try:
                      req = urllib.request.Request(url, data=payload, headers=headers, method="POST")
                      with urllib.request.urlopen(req, timeout=15) as r:
                          print(f'  → {group_id[:8]}... HTTP {r.status}')
                          return
                  except urllib.error.HTTPError as e:
                      last_err = e
                      if e.code in (429, 500, 502, 503, 504) and attempt < retries:
                          wait = 2 ** attempt
                          if e.code == 429:
                              try:
                                  retry_after = int(e.headers.get('Retry-After', 0))
                                  if retry_after > 0:
                                      wait = max(retry_after, wait)
                              except (ValueError, TypeError):
                                  pass
                          print(f'  WARN: HTTP {e.code} on attempt {attempt}, retrying in {wait}s...')
                          time.sleep(wait)
                      else:
                          break
                  except (urllib.error.URLError, TimeoutError) as e:
                      last_err = e
                      if attempt < retries:
                          wait = 2 ** attempt
                          print(f'  WARN: {e} on attempt {attempt}, retrying in {wait}s...')
                          time.sleep(wait)
                      else:
                          break
              print(f'ERROR: failed to send to {group_id[:8]}...: {last_err}')
              failed.append(group_id)

          def main():
              token = require_env("OCTO_BOT_TOKEN")
              repo_name = require_repo_name('REPO_NAME')
              pr_number = require_env("PR_NUMBER")
              pr_title = sanitize_text(require_env("PR_TITLE"))
              pr_url = require_env("PR_URL")
              pr_author = sanitize_text(require_env('PR_AUTHOR'), max_len=80)
              event_action = require_env("EVENT_ACTION")
              project_group_id = require_group_id("PROJECT_GROUP_ID")
              api_base_url = require_env("API_BASE_URL")

              api_base_url = api_base_url.rstrip('/')
              ALLOWED_API_BASES = {'https://im.deepminer.com.cn/api'}
              if api_base_url.lower() not in {b.lower() for b in ALLOWED_API_BASES}:
                  print(f'ERROR: API_BASE_URL is not in the allowlist: {api_base_url}')
                  sys.exit(2)

              if event_action not in ALLOWED_ACTIONS:
                  print(f"::warning::Unrecognized event_action '{event_action}', skipping")
                  sys.exit(0)

              emoji_map = {
                  "opened": "\U0001f535",
                  "ready_for_review": "✅",
                  "review_requested": "\U0001f440",
                  "synchronize": "\U0001f501",
              }
              emoji = emoji_map[event_action]

              if event_action == "synchronize":
                  message = (
                      f"{emoji} [{repo_name}] PR #{pr_number} · {pr_title} — new commits pushed\n"
                      f"\U0001f464 {pr_author}\n"
                      f"\U0001f517 {pr_url}"
                  )
              else:
                  message = (
                      f"{emoji} [{repo_name}] PR #{pr_number} · {pr_title}\n"
                      f"\U0001f464 {pr_author}\n"
                      f"\U0001f517 {pr_url}"
                  )

              failed = []
              send_message(api_base_url, token, project_group_id, message, failed)
              if failed:
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          PYEOF
