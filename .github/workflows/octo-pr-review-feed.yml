name: Octo PR Review Feed (reusable)

# Refactored (Wave 2): MAPPING stays here; TRANSPORT delegated to octo-notify.
# See docs/workflow-architecture.md Plane 6.

on:
  workflow_call:
    inputs:
      repo_name:
        type: string
        required: true
      pr_number:
        type: number
        required: true
      pr_title:
        type: string
        required: true
      pr_url:
        type: string
        required: true
      pr_author:
        type: string
        required: true
      event_action:
        type: string
        required: true
      project_group_id:
        type: string
        required: true
      api_base_url:
        type: string
        required: false
        default: 'https://im.deepminer.com.cn/api'
    secrets:
      OCTO_BOT_TOKEN:
        required: true

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build review message
        id: build
        env:
          REPO_NAME: ${{ inputs.repo_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          EVENT_ACTION: ${{ inputs.event_action }}
          PROJECT_GROUP_ID: ${{ inputs.project_group_id }}
        run: |
          python3 - <<'PYEOF'
          import os, re, sys

          OUT = os.environ['GITHUB_OUTPUT']
          DELIM = '__OCTO_NOTIFY_EOF_9f3a__'

          def emit(key, value):
              with open(OUT, 'a') as f:
                  f.write(f'{key}<<{DELIM}\n{value}\n{DELIM}\n')

          ALLOWED_ACTIONS = {"ready_for_review", "review_requested"}

          def require_env(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  print(f"::error::Missing required env var: {name}")
                  sys.exit(1)
              return value

          def require_group_id(name):
              val = os.environ.get(name, '').strip()
              if not re.fullmatch(r'[0-9a-f]{32}', val or ''):
                  print(f'ERROR: {name} must be a 32-char lowercase hex group id')
                  sys.exit(2)
              return val

          def require_repo_name(name):
              val = os.environ.get(name, '').strip()
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,99}', val or '') or val in {'.', '..'}:
                  print(f'ERROR: {name} contains invalid characters: {val!r}')
                  sys.exit(2)
              return val

          def sanitize_text(s, max_len=300):
              s = str(s or '')
              s = re.sub(r'[\x00-\x1f\x7f]', ' ', s)
              return s[:max_len]

          repo_name = require_repo_name('REPO_NAME')
          pr_number = require_env("PR_NUMBER")
          pr_title = sanitize_text(require_env("PR_TITLE"))
          pr_url = require_env("PR_URL")
          pr_author = sanitize_text(require_env('PR_AUTHOR'), max_len=80)
          event_action = require_env("EVENT_ACTION")
          require_group_id("PROJECT_GROUP_ID")

          if event_action not in ALLOWED_ACTIONS:
              print(f"::warning::Unrecognized event_action '{event_action}', skipping")
              emit('skip', 'true')
              sys.exit(0)

          emoji = {"ready_for_review": "✅", "review_requested": "\U0001f440"}[event_action]

          message = (
              f"{emoji} [{repo_name}] PR #{pr_number} · {pr_title}\n"
              f"\U0001f464 {pr_author}\n"
              f"\U0001f517 {pr_url}"
          )

          emit('skip', 'false')
          emit('im_message', message)
          PYEOF

      - name: Send to Octo IM
        if: steps.build.outputs.skip != 'true'
        uses: Mininglamp-OSS/.github/.github/actions/octo-notify@main
        with:
          im-message: ${{ steps.build.outputs.im_message }}
          im-token: ${{ secrets.OCTO_BOT_TOKEN }}
          im-group-id: ${{ inputs.project_group_id }}
          im-api-base: ${{ inputs.api_base_url }}
