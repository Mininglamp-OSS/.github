name: Octo CI Status (reusable)
# Reusable workflow: detects CI state changes on main branch and notifies Octo IM.
# Only fires when state transitions: success→failure (alert) or failure→success (recovery).

on:
  workflow_call:
    inputs:
      repo_name:
        type: string
        required: true
      workflow_name:
        type: string
        required: true
      conclusion:
        type: string
        required: true
      run_id:
        type: number
        required: false
        default: 0
      run_url:
        type: string
        required: true
      project_group_id:
        type: string
        required: true
    secrets:
      OCTO_BOT_TOKEN:
        required: true

permissions:
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check state change and notify Octo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCTO_BOT_TOKEN: ${{ secrets.OCTO_BOT_TOKEN }}
          REPO_NAME: ${{ inputs.repo_name }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          CONCLUSION: ${{ inputs.conclusion }}
          RUN_ID: ${{ inputs.run_id }}
          RUN_URL: ${{ inputs.run_url }}
          PROJECT_GROUP_ID: ${{ inputs.project_group_id }}
        run: python3 scripts/octo_ci_status_notify.py
