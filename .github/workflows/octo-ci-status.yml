name: Octo CI Status (reusable)
# Reusable workflow: detects CI state changes on main branch and notifies Octo IM.
# Only fires when state transitions: success→failure (alert) or failure→success (recovery).
#
# Refactored (Wave 2): the state-machine MAPPING (fetch run + history, compute
# transition, format message) stays here; TRANSPORT delegated to the shared
# octo-notify action. Two IM targets (ci-status feed + repo project group) → two
# octo-notify steps. See docs/workflow-architecture.md Plane 6.

on:
  workflow_call:
    inputs:
      repo_name:
        type: string
        required: true
      workflow_name:
        type: string
        required: true
      conclusion:
        type: string
        required: true
      run_id:
        type: number
        required: false
        default: 0
      workflow_id:
        type: number
        required: true
        description: 'Numeric workflow ID. Pass github.event.workflow_run.workflow_id from the calling workflow (workflow_run event context).'
      run_url:
        type: string
        required: true
      project_group_id:
        type: string
        required: true
      api_base_url:
        type: string
        required: false
        default: 'https://im.deepminer.com.cn/api'
        description: 'Octo IM API base URL. Only the production endpoint is allowlisted; any other value will cause the workflow to fail.'
      ci_status_group_id:
        type: string
        required: false
        default: '4ade985d984e432eb7fbdd0ad4f8118a'
        description: 'Octo IM group ID for the central CI status feed.'
    secrets:
      OCTO_BOT_TOKEN:
        required: true

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Compute CI state transition and build message
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ inputs.repo_name }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          CONCLUSION: ${{ inputs.conclusion }}
          RUN_ID: ${{ inputs.run_id }}
          WORKFLOW_ID: ${{ inputs.workflow_id }}
          RUN_URL: ${{ inputs.run_url }}
          PROJECT_GROUP_ID: ${{ inputs.project_group_id }}
          CI_STATUS_GROUP_ID: ${{ inputs.ci_status_group_id }}
        run: |
          python3 - <<'PYEOF'
          import os, json, re, urllib.request, urllib.error, sys

          OUT = os.environ['GITHUB_OUTPUT']
          DELIM = '__OCTO_NOTIFY_EOF_9f3a__'

          def emit(key, value):
              with open(OUT, 'a') as f:
                  f.write(f'{key}<<{DELIM}\n{value}\n{DELIM}\n')

          def skip(reason):
              print(reason)
              emit('skip', 'true')
              sys.exit(0)

          def require_env(name):
              val = os.environ.get(name, '').strip()
              if not val:
                  print(f'ERROR: required environment variable {name} is missing or empty')
                  sys.exit(2)
              return val

          def require_group_id(name):
              """Validate format only (32-char hex); this is not an authorization check."""
              val = require_env(name)
              if not re.fullmatch(r'[0-9a-f]{32}', val):
                  print(f'ERROR: {name} must be a 32-char lowercase hex group id')
                  sys.exit(2)
              return val

          def require_repo_name(name):
              """Validate repo name to prevent path traversal in GitHub API URLs."""
              val = require_env(name)
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,99}', val) or val in {'.', '..'}:
                  print(f'ERROR: {name} contains invalid characters: {val!r}')
                  sys.exit(2)
              return val

          conclusion = require_env('CONCLUSION')
          # Cancelled runs are not real failures; skip silently
          if conclusion == 'cancelled':
              skip('Cancelled run, skipping.')

          repo      = require_repo_name('REPO_NAME')
          wf_name   = require_env('WORKFLOW_NAME')
          run_url   = require_env('RUN_URL')
          proj_gid  = require_group_id('PROJECT_GROUP_ID')
          ci_gid    = require_group_id('CI_STATUS_GROUP_ID')
          gh_token  = require_env('GITHUB_TOKEN')

          workflow_id = int(os.environ.get('WORKFLOW_ID', 0) or 0)

          # 1. Fetch the current run precisely by run_id
          run_id = int(os.environ.get('RUN_ID', 0) or 0)
          current = None
          if run_id:
              req_current = urllib.request.Request(
                  f'https://api.github.com/repos/Mininglamp-OSS/{repo}/actions/runs/{run_id}',
                  headers={
                      'Authorization': f'Bearer {gh_token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  }
              )
              try:
                  with urllib.request.urlopen(req_current, timeout=15) as r:
                      current = json.load(r)
              except (urllib.error.HTTPError, urllib.error.URLError) as e:
                  print(f'ERROR: failed to fetch run {run_id}: {e}')
                  sys.exit(1)

          # 2. Fetch previous completed runs (scoped to this workflow if workflow_id is known)
          if workflow_id:
              history_url = (
                  f'https://api.github.com/repos/Mininglamp-OSS/{repo}/actions/workflows/{workflow_id}/runs'
                  f'?branch=main&status=completed&per_page=30'
              )
          else:
              history_url = (
                  f'https://api.github.com/repos/Mininglamp-OSS/{repo}/actions/runs'
                  f'?branch=main&status=completed&per_page=30'
              )
          req_hist = urllib.request.Request(history_url, headers={
              'Authorization': f'Bearer {gh_token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          try:
              with urllib.request.urlopen(req_hist, timeout=15) as r:
                  all_runs = json.load(r)['workflow_runs']
          except (urllib.error.HTTPError, urllib.error.URLError) as e:
              print(f'ERROR: failed to fetch workflow run history: {e}')
              sys.exit(1)

          # If run_id wasn't passed or lookup failed, fall back to first matching in history
          if not current:
              same_wf = [r for r in all_runs if r['name'] == wf_name]
              if not same_wf:
                  skip('No matching runs found, skipping.')
              current = same_wf[0]

          curr_created = current['created_at']

          # Previous: any run older than current (by created_at), same workflow name
          older = sorted(
              [r for r in all_runs
               if r['id'] != current['id']
               and r['name'] == wf_name  # defensive; redundant when workflow_id is set (already scoped)
               and r['created_at'] < curr_created],
              key=lambda r: r['created_at'],
              reverse=True,
          )
          previous = older[0] if older else None

          curr_conclusion = current['conclusion']
          prev_conclusion = previous['conclusion'] if previous else None

          print(f'State: {prev_conclusion} → {curr_conclusion}')

          # Only act on state changes
          if curr_conclusion == prev_conclusion:
              skip('No state change, silent.')

          # Guard: first-ever run has no previous history — skip silently
          if prev_conclusion is None:
              skip('First run detected (no previous history), skipping notification.')

          # Failure-like conclusions: treat all of these as "CI broken"
          FAILURE_LIKE = {'failure', 'timed_out', 'action_required', 'startup_failure'}

          curr_failed = curr_conclusion in FAILURE_LIKE
          prev_failed = prev_conclusion in FAILURE_LIKE

          if curr_failed and not prev_failed:
              status_label = {'timed_out': '⏱️ timed out', 'action_required': '⚠️ action required',
                              'startup_failure': '💥 startup failed'}.get(curr_conclusion, '❌ failed')
              msg = (
                  f'🚨 [{repo}] main CI {status_label}\n\n'
                  f'工作流：{wf_name}\n'
                  f'🔗 {run_url}'
              )
          elif curr_conclusion == 'success' and prev_failed:
              msg = (
                  f'✅ [{repo}] main CI 已恢复\n\n'
                  f'工作流：{wf_name}\n'
                  f'🔗 {run_url}'
              )
          else:
              skip(f'Unhandled transition {prev_conclusion!r} → {curr_conclusion!r}, skipping.')

          emit('skip', 'false')
          emit('im_message', msg)
          emit('ci_group_id', ci_gid)
          emit('project_group_id', proj_gid)
          PYEOF

      - name: Send to CI status feed
        if: steps.build.outputs.skip != 'true'
        uses: Mininglamp-OSS/.github/.github/actions/octo-notify@v1
        with:
          im-message: ${{ steps.build.outputs.im_message }}
          im-token: ${{ secrets.OCTO_BOT_TOKEN }}
          im-group-id: ${{ steps.build.outputs.ci_group_id }}
          im-api-base: ${{ inputs.api_base_url }}

      - name: Send to repo project group
        # Run even if the ci-status send failed, so one IM group outage does not
        # suppress the other (matches the original "attempt both groups" behavior).
        if: ${{ always() && steps.build.outputs.skip != 'true' }}
        uses: Mininglamp-OSS/.github/.github/actions/octo-notify@v1
        with:
          im-message: ${{ steps.build.outputs.im_message }}
          im-token: ${{ secrets.OCTO_BOT_TOKEN }}
          im-group-id: ${{ steps.build.outputs.project_group_id }}
          im-api-base: ${{ inputs.api_base_url }}
