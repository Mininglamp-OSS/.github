name: Octo CI Status (reusable)
# Reusable workflow: detects CI state changes on main branch and notifies Octo IM.
# Only fires when state transitions: success→failure (alert) or failure→success (recovery).

on:
  workflow_call:
    inputs:
      repo_name:
        type: string
        required: true
      workflow_name:
        type: string
        required: true
      conclusion:
        type: string
        required: true
      run_id:
        type: number
        required: false
        default: 0
      workflow_id:
        type: number
        required: false
        default: 0
        description: 'Numeric workflow ID (strongly recommended). Without it, run history is fetched globally for the repo and may include other workflows. Pass ${{ github.workflow_run.workflow_id }} from caller.'
      run_url:
        type: string
        required: true
      project_group_id:
        type: string
        required: true
    secrets:
      OCTO_BOT_TOKEN:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reusable-workflow scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: Mininglamp-OSS/.github
          ref: main
          # NOTE: pinning to main; scripts and workflow always come from the
          # same protected branch. For stricter version lock, pass a shared_ref
          # input from caller workflows.
          path: _shared
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check state change and notify Octo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCTO_BOT_TOKEN: ${{ secrets.OCTO_BOT_TOKEN }}
          REPO_NAME: ${{ inputs.repo_name }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          CONCLUSION: ${{ inputs.conclusion }}
          RUN_ID: ${{ inputs.run_id }}
          WORKFLOW_ID: ${{ inputs.workflow_id }}
          RUN_URL: ${{ inputs.run_url }}
          PROJECT_GROUP_ID: ${{ inputs.project_group_id }}
        run: python3 _shared/scripts/octo_ci_status_notify.py
