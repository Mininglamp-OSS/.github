# Reusable workflow: notify Octo IM when an issue event occurs.
# Called from per-repo caller workflows.
name: Octo Issue Feed (reusable)

on:
  workflow_call:
    inputs:
      repo_name:
        type: string
        required: true
      issue_number:
        type: number
        required: true
      issue_title:
        type: string
        required: true
      issue_url:
        type: string
        required: true
      issue_author:
        type: string
        required: true
      issue_labels:
        type: string
        default: '[]'
      event_action:
        type: string
        required: true
      project_group_id:
        type: string
        required: true
    secrets:
      OCTO_BOT_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reusable-workflow scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: Mininglamp-OSS/.github
          ref: ${{ github.workflow_sha }}
          path: _shared
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Send to Octo
        env:
          OCTO_BOT_TOKEN: ${{ secrets.OCTO_BOT_TOKEN }}
          REPO_NAME: ${{ inputs.repo_name }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          ISSUE_URL: ${{ inputs.issue_url }}
          ISSUE_AUTHOR: ${{ inputs.issue_author }}
          ISSUE_LABELS: ${{ inputs.issue_labels }}
          EVENT_ACTION: ${{ inputs.event_action }}
          PROJECT_GROUP_ID: ${{ inputs.project_group_id }}
        run: python3 _shared/scripts/octo_issue_feed_notify.py
