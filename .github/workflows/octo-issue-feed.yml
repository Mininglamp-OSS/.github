# Reusable workflow: notify Octo IM when an issue event occurs.
# Called from per-repo caller workflows.
name: Octo Issue Feed (reusable)

on:
  workflow_call:
    inputs:
      repo_name:
        type: string
        required: true
      issue_number:
        type: number
        required: true
      issue_title:
        type: string
        required: true
      issue_url:
        type: string
        required: true
      issue_author:
        type: string
        required: true
      issue_labels:
        type: string
        default: '[]'
      event_action:
        type: string
        required: true
      project_group_id:
        type: string
        required: true
      api_base_url:
        type: string
        required: false
        default: 'https://im.deepminer.com.cn/api'
        description: 'Octo IM API base URL (without trailing slash)'
    secrets:
      OCTO_BOT_TOKEN:
        required: true

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Octo IM
        env:
          OCTO_BOT_TOKEN: ${{ secrets.OCTO_BOT_TOKEN }}
          REPO_NAME: ${{ inputs.repo_name }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          ISSUE_URL: ${{ inputs.issue_url }}
          ISSUE_AUTHOR: ${{ inputs.issue_author }}
          ISSUE_LABELS: ${{ inputs.issue_labels }}
          EVENT_ACTION: ${{ inputs.event_action }}
          PROJECT_GROUP_ID: ${{ inputs.project_group_id }}
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          python3 - << 'PYEOF'
          import os, json, sys, time, urllib.request, urllib.error
          
          
          def require_env(name):
              val = os.environ.get(name, '').strip()
              if not val:
                  print(f'ERROR: required environment variable {name} is missing or empty')
                  sys.exit(2)
              return val
          
          
          action = require_env('EVENT_ACTION')
          emoji = {'opened': '🆕', 'closed': '✅', 'reopened': '🔄', 'labeled': '🏷️'}.get(action, 'ℹ️')
          
          try:
              labels = json.loads(os.environ.get('ISSUE_LABELS', '[]'))
              labels_part = ' · 🏷️ ' + ', '.join(labels) if labels else ''
          except Exception:
              labels_part = ''
          
          repo  = require_env('REPO_NAME')
          num   = require_env('ISSUE_NUMBER')
          title = require_env('ISSUE_TITLE')
          url   = require_env('ISSUE_URL')
          author = require_env('ISSUE_AUTHOR')
          
          feed_msg = f"{emoji} [{repo}] Issue #{num} · {title}\n👤 {author}{labels_part}\n🔗 {url}"
          proj_msg = f"{emoji} Issue #{num} · {title}\n👤 {author}{labels_part}\n🔗 {url}"
          
          api = os.environ.get('API_BASE_URL', 'https://im.deepminer.com.cn/api').rstrip('/') + '/v1/bot/sendMessage'
          token = require_env('OCTO_BOT_TOKEN')
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          
          failed = []
          
          def send(group_id, message):
              body = json.dumps({
                  'channel_id': group_id,
                  'channel_type': 2,
                  'payload': {'type': 1, 'content': message},
              }).encode()
              last_err = None
              for attempt in range(1, 4):
                  req = urllib.request.Request(api, data=body, headers=headers, method='POST')
                  try:
                      with urllib.request.urlopen(req, timeout=15) as r:
                          print(f'  → {group_id[:8]}... HTTP {r.status}')
                          return  # success
                  except urllib.error.HTTPError as e:
                      last_err = e
                      if e.code in (429, 500, 502, 503, 504) and attempt < 3:
                          wait = 2 ** attempt
                          if e.code == 429:
                              try:
                                  retry_after = int(e.headers.get('Retry-After', 0))
                                  if retry_after > 0:
                                      wait = max(retry_after, wait)
                              except (ValueError, TypeError):
                                  pass
                          print(f'  WARN: HTTP {e.code} on attempt {attempt}, retrying in {wait}s...')
                          time.sleep(wait)
                      else:
                          break
                  except (urllib.error.URLError, TimeoutError) as e:
                      last_err = e
                      if attempt < 3:
                          wait = 2 ** attempt
                          print(f'  WARN: {e} on attempt {attempt}, retrying in {wait}s...')
                          time.sleep(wait)
                      else:
                          break
              print(f'ERROR: failed to send message to {group_id[:8]}...: {last_err}')
              failed.append(group_id)
          
          proj_gid = require_env('PROJECT_GROUP_ID')
          send('151a45970e1546afa9e947ac36a5c4e5', feed_msg)
          send(proj_gid, proj_msg)

          # Trigger IssueTriage bot on newly opened issues
          if action == 'opened':
              triage_msg = (
                  '@[27pmzxx8nad78c9d01e_bot:Octo 助理-IssueTriage] [TRIAGE] '
                  f'https://github.com/Mininglamp-OSS/{repo}/issues/{num}'
              )
              send('151a45970e1546afa9e947ac36a5c4e5', triage_msg)

          if failed:
              sys.exit(1)
          PYEOF
