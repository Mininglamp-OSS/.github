# DEPRECATED SHIM — kept only for backward compatibility.
#
# octo-issue-feed.yml was renamed to octo-issue-notify.yml (Wave 1). Callers
# still pinning `octo-issue-feed.yml` keep working through this thin pass-through,
# which forwards every input and secret to the canonical reusable.
#
# Migrate your caller to:
#   uses: Mininglamp-OSS/.github/.github/workflows/octo-issue-notify.yml@v1
#
# This shim will be REMOVED once all callers have migrated. Do not add new
# callers against this file.
name: Octo Issue Feed (deprecated shim)

on:
  workflow_call:
    inputs:
      repo_name:
        type: string
        required: true
      issue_number:
        type: number
        required: true
      issue_title:
        type: string
        required: true
      issue_url:
        type: string
        required: true
      issue_author:
        type: string
        required: true
      event_action:
        type: string
        required: true
      api_base_url:
        type: string
        required: false
        default: 'https://im.deepminer.com.cn/api'
      feed_group_id:
        type: string
        required: false
        default: '151a45970e1546afa9e947ac36a5c4e5'
    secrets:
      OCTO_BOT_TOKEN:
        required: true
      TRIAGE_WEBHOOK_URL:
        required: false

permissions: {}

jobs:
  forward:
    # Pinned to @main so the shim always forwards to the current canonical
    # reusable. (Callers pinning the shim at @v1 still resolve THIS file as it
    # existed in v1.0.0, which forwards to octo-issue-notify.yml@main.)
    uses: Mininglamp-OSS/.github/.github/workflows/octo-issue-notify.yml@main
    with:
      repo_name: ${{ inputs.repo_name }}
      issue_number: ${{ inputs.issue_number }}
      issue_title: ${{ inputs.issue_title }}
      issue_url: ${{ inputs.issue_url }}
      issue_author: ${{ inputs.issue_author }}
      event_action: ${{ inputs.event_action }}
      api_base_url: ${{ inputs.api_base_url }}
      feed_group_id: ${{ inputs.feed_group_id }}
    secrets:
      OCTO_BOT_TOKEN: ${{ secrets.OCTO_BOT_TOKEN }}
      TRIAGE_WEBHOOK_URL: ${{ secrets.TRIAGE_WEBHOOK_URL }}
