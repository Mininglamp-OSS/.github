name: Reusable — Release Drafter

on:
  workflow_call:
    inputs:
      config-name:
        description: 'release-drafter config filename under .github/'
        type: string
        required: false
        default: 'release-drafter.yml'

permissions: {}

jobs:
  draft:
    name: Update Release Draft
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        with:
          config-name: ${{ inputs.config-name }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
