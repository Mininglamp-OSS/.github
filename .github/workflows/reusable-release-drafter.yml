name: Reusable — Release Drafter

on:
  workflow_call:
    inputs:
      config-name:
        description: 'release-drafter config filename under .github/'
        type: string
        required: false
        default: 'release-drafter.yml'

permissions: {}

jobs:
  draft:
    name: Update Release Draft
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: release-drafter/release-drafter@ed4bc48ec97379be2258e7b7ac2624a3e26ab809 # v7.4.0
        with:
          config-name: ${{ inputs.config-name }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
