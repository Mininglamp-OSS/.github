# Reusable workflow: notify Octo IM when a PR event occurs.
# Called from per-repo caller workflows.
name: Octo PR Feed (reusable)

on:
  workflow_call:
    inputs:
      repo_name:
        type: string
        required: true
      pr_number:
        type: number
        required: true
      pr_title:
        type: string
        required: true
      pr_url:
        type: string
        required: true
      pr_author:
        type: string
        required: true
      pr_merged:
        type: boolean
        default: false
      pr_additions:
        type: number
        default: 0
      pr_deletions:
        type: number
        default: 0
      pr_changed_files:
        type: number
        default: 0
      event_action:
        type: string
        required: true
      project_group_id:
        type: string
        required: true
    secrets:
      OCTO_BOT_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reusable-workflow scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: Mininglamp-OSS/.github
          ref: ${{ github.workflow_sha }}
          path: _shared
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Send to Octo
        env:
          OCTO_BOT_TOKEN: ${{ secrets.OCTO_BOT_TOKEN }}
          REPO_NAME: ${{ inputs.repo_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          PR_MERGED: ${{ inputs.pr_merged }}
          PR_ADDITIONS: ${{ inputs.pr_additions }}
          PR_DELETIONS: ${{ inputs.pr_deletions }}
          PR_CHANGED_FILES: ${{ inputs.pr_changed_files }}
          EVENT_ACTION: ${{ inputs.event_action }}
          PROJECT_GROUP_ID: ${{ inputs.project_group_id }}
        run: python3 _shared/scripts/octo_pr_feed_notify.py
