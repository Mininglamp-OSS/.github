# Auto-add issues and PRs to the org-level GitHub Project board, and set the
# Module field on the newly-added Project item based on the source repository.
#
# This is a reusable workflow: child repositories within the Mininglamp-OSS
# organization can call it via `workflow_call` to share a single, centrally
# maintained automation. It also runs directly for issues and pull requests
# opened in the .github repository itself.
#
# Why a workflow instead of GitHub's native Auto-add rule:
# GitHub Projects has a built-in Auto-add workflow, but it can only be
# configured through the Project's web UI — there is no API to manage it.
# That violates Infrastructure as Code: the rule cannot be reviewed,
# version-controlled, or reproduced across projects from this repo. This
# Actions-based approach keeps the automation declarative and auditable.
#
# Direct-trigger requirements:
# When this workflow runs directly (issues / pull_request_target events in
# this .github repo), it needs a PROJECT_TOKEN secret configured on the
# .github repository itself (or as an organization-level secret available
# to it). The workflow_call path receives the secret from the caller.
#
# Caller repos invoke it like:
#   jobs:
#     add-to-project:
#       uses: Mininglamp-OSS/.github/.github/workflows/auto-add-to-project.yml@v1
#       secrets:
#         PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
#
# Known callers (19 repos):
#   - .github (direct trigger)
#   - claw-channel-octo
#   - community
#   - octo-adapters
#   - octo-admin
#   - octo-android
#   - octo-cli
#   - octo-daemon-cli
#   - octo-deployment
#   - octo-im
#   - octo-ios
#   - octo-lib
#   - octo-matter
#   - octo-server
#   - octo-smart-summary
#   - octo-speech
#   - octo-version-sync
#   - octo-web
#   - openclaw-channel-octo
#
# No "concurrency:" group is defined because actions/add-to-project is
# idempotent on already-added items — concurrent runs are harmless.
name: Auto add to project (reusable)

on:
  workflow_call:
    inputs:
      project-number:
        description: "GitHub Project V2 number (org-level)"
        required: false
        type: number
        default: 2
      org-login:
        description: "GitHub organization login"
        required: false
        type: string
        default: "Mininglamp-OSS"
    secrets:
      PROJECT_TOKEN:
        required: true
  issues:
    types: [opened]
  # pull_request_target (rather than pull_request) is required so that PRs
  # opened from forks can access the PROJECT_TOKEN secret — pull_request
  # runs in the fork's context and has no access to secrets.
  #
  # SECURITY: do NOT add `actions/checkout` (or otherwise check out the PR
  # head ref) to this workflow. pull_request_target runs in the base repo's
  # privileged context with access to PROJECT_TOKEN; checking out untrusted
  # PR code here would let a malicious fork exfiltrate the token.
  #
  # "edited" is included so that Sprint inheritance re-runs when the PR
  # description is updated (e.g. developer adds "Closes #<issue>" after
  # opening). The add-to-project step is idempotent for already-added items.
  pull_request_target:
    types: [opened, edited]

permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add issue or PR to org project
        id: add-project
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/orgs/${{ inputs.org-login || 'Mininglamp-OSS' }}/projects/${{ inputs.project-number || 2 }}
          github-token: ${{ secrets.PROJECT_TOKEN }}

      - name: Set Module field from repository
        if: steps.add-project.outputs.itemId
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ITEM_ID: ${{ steps.add-project.outputs.itemId }}
          REPO_NAME: ${{ github.event.repository.name }}
          ORG_LOGIN: ${{ inputs.org-login || 'Mininglamp-OSS' }}
          PROJECT_NUMBER: ${{ inputs.project-number || 2 }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // Map repo name → Module option NAME (resolved to an option ID at runtime).
            // Names — not opaque option IDs — survive Module-field rebuilds as long as
            // the option labels match.
            const REPO_MODULE = {
              '.github':               'infra',
              'claw-channel-octo':     'adapters',
              'community':             'infra',
              'octo-adapters':         'adapters',
              'octo-admin':            'admin',
              'octo-android':          'android',
              'octo-cli':              'cli',
              'octo-daemon-cli':       'cli',
              'octo-deployment':       'deployment',
              'octo-fleet':            'server',
              'octo-im':               'server',
              'octo-ios':              'ios',
              'octo-lib':              'lib',
              'octo-matter':           'matter',
              'octo-server':           'server',
              'octo-smart-summary':    'smart-summary',
              'octo-speech':           'speech',
              'octo-version-sync':     'infra',
              'octo-web':              'web',
              'openclaw-channel-octo': 'adapters',
            };

            const repoName = process.env.REPO_NAME;
            const orgLogin = process.env.ORG_LOGIN;
            const projectNumber = parseInt(process.env.PROJECT_NUMBER, 10);

            const moduleName = REPO_MODULE[repoName];
            if (!moduleName) {
              core.info(`No Module mapping for repo "${repoName}" — skipping`);
              return;
            }

            // Resolve project ID + Module field (id + options) by name at runtime,
            // so this workflow self-heals across project rebuilds / field recreations
            // as long as the "Module" field and its option labels match.
            const projectData = await github.graphql(`
              query($orgLogin: String!, $projectNumber: Int!) {
                organization(login: $orgLogin) {
                  projectV2(number: $projectNumber) {
                    id
                    field(name: "Module") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            `, { orgLogin, projectNumber });

            const project = projectData?.organization?.projectV2;
            if (!project?.id) {
              core.warning(`Project #${projectNumber} not found on org "${orgLogin}" — skipping Module set`);
              return;
            }
            const moduleField = project.field;
            if (!moduleField?.id) {
              core.warning(`"Module" single-select field not found on project #${projectNumber} — skipping`);
              return;
            }
            const option = moduleField.options.find(o => o.name === moduleName);
            if (!option) {
              core.warning(`Module option "${moduleName}" not found on project — skipping (available: ${moduleField.options.map(o => o.name).join(', ')})`);
              return;
            }

            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `, {
              projectId: project.id,
              itemId: process.env.ITEM_ID,
              fieldId: moduleField.id,
              optionId: option.id,
            });

            core.info(`Set Module to "${moduleName}" for repo "${repoName}" on item ${process.env.ITEM_ID}`);

      - name: Inherit Sprint from linked issues
        # Only run for PR events (issues event has no linked issues to inherit from).
        # Silently skips if no linked issue has a Sprint — does not fail the workflow.
        if: >-
          steps.add-project.outputs.itemId &&
          github.event_name == 'pull_request_target'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ITEM_ID: ${{ steps.add-project.outputs.itemId }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.event.repository.owner.login }}
          REPO_NAME: ${{ github.event.repository.name }}
          ORG_LOGIN: ${{ inputs.org-login || 'Mininglamp-OSS' }}
          PROJECT_NUMBER: ${{ inputs.project-number || 2 }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner    = process.env.REPO_OWNER;
            const repoName = process.env.REPO_NAME;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const itemId   = process.env.ITEM_ID;
            const orgLogin = process.env.ORG_LOGIN;
            const projectNumber = parseInt(process.env.PROJECT_NUMBER, 10);

            // Resolve project ID + Sprint iteration field ID by name at runtime.
            const projectData = await github.graphql(`
              query($orgLogin: String!, $projectNumber: Int!) {
                organization(login: $orgLogin) {
                  projectV2(number: $projectNumber) {
                    id
                    field(name: "Sprint") {
                      ... on ProjectV2IterationField {
                        id
                      }
                    }
                  }
                }
              }
            `, { orgLogin, projectNumber });

            const project = projectData?.organization?.projectV2;
            if (!project?.id) {
              core.warning(`Project #${projectNumber} not found on org "${orgLogin}" — skipping Sprint inheritance`);
              return;
            }
            const sprintField = project.field;
            if (!sprintField?.id) {
              core.warning(`"Sprint" iteration field not found on project #${projectNumber} — skipping`);
              return;
            }
            const projectId = project.id;
            const sprintFieldId = sprintField.id;

            // Query linked issues and their Sprint values, plus the PR's own Sprint on the board.
            const result = await github.graphql(`
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 100) {
                      nodes {
                        number
                        title
                        projectItems(first: 100) {
                          nodes {
                            project { id }
                            sprint: fieldValueByName(name: "Sprint") {
                              ... on ProjectV2ItemFieldIterationValue {
                                iterationId
                                title
                              }
                            }
                          }
                        }
                      }
                    }
                    projectItems(first: 10) {
                      nodes {
                        project { id }
                        sprint: fieldValueByName(name: "Sprint") {
                          ... on ProjectV2ItemFieldIterationValue {
                            iterationId
                            title
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { owner, name: repoName, number: prNumber });

            const linkedIssues = result?.repository?.pullRequest
              ?.closingIssuesReferences?.nodes ?? [];

            if (linkedIssues.length === 0) {
              core.info('No linked issues found — skipping Sprint inheritance.');
              return;
            }

            // Check if the PR's board item already has a Sprint; if so, skip inheritance
            // to avoid overwriting a Sprint that was set intentionally (e.g. a developer
            // later edited the PR body to close an older-sprint issue).
            const prProjectItems = result?.repository?.pullRequest?.projectItems?.nodes ?? [];
            const prBoardItem = prProjectItems.find(item => item.project?.id === projectId);
            if (prBoardItem?.sprint?.iterationId) {
              core.info(`PR item already has Sprint "${prBoardItem.sprint.title}" — skipping inheritance to avoid overwrite.`);
              return;
            }

            // Find the first linked issue that has a Sprint on the Octo Board
            let sprintIterationId = null;
            let sprintTitle = null;

            for (const issue of linkedIssues) {
              for (const projItem of (issue.projectItems?.nodes ?? [])) {
                if (projItem.project?.id === projectId && projItem.sprint?.iterationId) {
                  sprintIterationId = projItem.sprint.iterationId;
                  sprintTitle = projItem.sprint.title;
                  break;
                }
              }
              if (sprintIterationId) break;
            }

            if (!sprintIterationId) {
              core.info('No linked issue has a Sprint set on the Octo Board — skipping.');
              return;
            }

            // Copy the Sprint to the PR's board item
            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $iterationId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { iterationId: $iterationId }
                }) {
                  projectV2Item { id }
                }
              }
            `, {
              projectId,
              itemId,
              fieldId: sprintFieldId,
              iterationId: sprintIterationId,
            });

            core.info(`Inherited Sprint "${sprintTitle}" from linked issue onto PR item ${itemId}.`);

