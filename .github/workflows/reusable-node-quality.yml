# Reusable workflow: Node Test Quality
#
# Provides typecheck, lint, test (optional), and build jobs for Node.js
# projects using pnpm or npm.
#
# Usage:
#   jobs:
#     quality:
#       uses: Mininglamp-OSS/.github/.github/workflows/reusable-node-quality.yml@main
#       with:
#         package-manager: pnpm
#         node-version: '20'
#         has-tests: false

name: Reusable — Node Test Quality

on:
  workflow_call:
    inputs:
      package-manager:
        description: 'Package manager: pnpm or npm'
        required: false
        type: string
        default: 'pnpm'
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      working-directory:
        description: 'Working directory for all commands'
        required: false
        type: string
        default: '.'
      has-tests:
        description: 'Whether the project has tests to run'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  # ── Type Check ──────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: inputs.package-manager == 'pnpm'
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager == 'pnpm' && 'pnpm' || 'npm' }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/pnpm-lock.yaml
            ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm|npm) ;;
            *) echo "::error::unsupported package-manager: $PACKAGE_MANAGER" >&2; exit 2 ;;
          esac
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Type check
        run: npx tsc --noEmit

  # ── Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: inputs.package-manager == 'pnpm'
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager == 'pnpm' && 'pnpm' || 'npm' }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/pnpm-lock.yaml
            ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm|npm) ;;
            *) echo "::error::unsupported package-manager: $PACKAGE_MANAGER" >&2; exit 2 ;;
          esac
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            pnpm lint
          else
            npm run lint
          fi

  # ── Test (only when has-tests is true) ──────────────────────────────
  test:
    if: inputs.has-tests
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: inputs.package-manager == 'pnpm'
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager == 'pnpm' && 'pnpm' || 'npm' }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/pnpm-lock.yaml
            ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm|npm) ;;
            *) echo "::error::unsupported package-manager: $PACKAGE_MANAGER" >&2; exit 2 ;;
          esac
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Run tests with coverage
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            pnpm test --coverage
          else
            npm test -- --coverage
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-coverage
          path: |
            ${{ inputs.working-directory }}/coverage/
          retention-days: 7

  # ── Coverage Report (separate job with write permissions) ───────────
  report-coverage:
    # Skip on fork PRs: forks receive a read-only GITHUB_TOKEN, so the
    # vitest-coverage-report-action would fail to post the PR comment and
    # block the required quality-gate for external contributors.
    if: >-
      inputs.has-tests &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Coverage Report
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-coverage
          path: ${{ inputs.working-directory }}/coverage

      - name: Coverage report
        uses: davelosert/vitest-coverage-report-action@02f3c2e641286b7fa308cd3e430783103ce6103b # v2
        with:
          working-directory: ${{ inputs.working-directory }}

  # ── Build ───────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: inputs.package-manager == 'pnpm'
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager == 'pnpm' && 'pnpm' || 'npm' }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/pnpm-lock.yaml
            ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm|npm) ;;
            *) echo "::error::unsupported package-manager: $PACKAGE_MANAGER" >&2; exit 2 ;;
          esac
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Build
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            pnpm build
          else
            npm run build
          fi

  # ── Quality Gate ────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [typecheck, lint, build, test, report-coverage]
    permissions:
      contents: read
    steps:
      - name: Evaluate results
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_REPORT_RESULT: ${{ needs.report-coverage.result }}
        run: |
          failed=false

          if [ "$TYPECHECK_RESULT" != "success" ]; then
            echo "::error::typecheck failed (result: $TYPECHECK_RESULT)"
            failed=true
          fi
          if [ "$LINT_RESULT" != "success" ]; then
            echo "::error::lint failed (result: $LINT_RESULT)"
            failed=true
          fi
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::build failed (result: $BUILD_RESULT)"
            failed=true
          fi
          # test is optional (has-tests), skipped is ok
          if [ "$TEST_RESULT" != "success" ] && [ "$TEST_RESULT" != "skipped" ]; then
            echo "::error::test failed (result: $TEST_RESULT)"
            failed=true
          fi
          # report-coverage only runs on PRs with has-tests, skipped is ok
          if [ "$COVERAGE_REPORT_RESULT" != "success" ] && [ "$COVERAGE_REPORT_RESULT" != "skipped" ]; then
            echo "::error::coverage report failed (result: $COVERAGE_REPORT_RESULT)"
            failed=true
          fi

          if [ "$failed" = "true" ]; then
            exit 1
          fi
          echo "✅ All quality gates passed"
