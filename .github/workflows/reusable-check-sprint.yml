# Reusable workflow: Check Sprint on Merge
#
# KNOWN LIMITATION: STALE CHECK ON SPRINT ROLLOVER
#
# This check runs at push time. Branch protection caches the result per
# commit SHA. A PR can pass "Sprint=W21" on Friday, the sprint rolls to
# W22 on Monday, and the PR can still merge using the stale green check
# without re-running.
#
# RECOMMENDED MITIGATION:
#   Enable "Require branches to be up to date before merging" in branch
#   protection settings. This forces a fresh push whenever main moves,
#   which re-triggers all checks including this one.
#
# RESIDUAL RISK:
#   If the branch is already up-to-date with main and the sprint rolls
#   over between the last push and the merge, the stale check will
#   still allow the merge. Use `enforce-freshness: true` to add a
#   commit-timestamp guard.
#   NOTE: this guard only runs when the check is re-triggered. It does NOT
#   retroactively invalidate a stale green check from a previous SHA.
#
# Security model:
#   - Callers use pull_request_target so the workflow has access to secrets
#     even for PRs from forks. This is safe here because we never check out
#     or execute PR code -- the only action is a read-only GraphQL query
#     against the GitHub Projects API.
#   - permissions is set to empty ({}) so the GITHUB_TOKEN carries zero scopes.
#     All API calls use the dedicated PROJECT_TOKEN PAT, which only needs
#     read:project (and read:org for org-level project access).
#
# PROJECT_TOKEN required scopes:
#   Classic PAT:      read:project + read:org
#   Fine-grained PAT: "Projects: Read" + "Organization custom roles: Read"
#                     (for org-level project access)
# For private repositories, additionally:
#   Classic PAT:      repo
#   Fine-grained PAT: "Contents: Read" + "Pull requests: Read"
# Note: public repositories do not require extra repository scopes.
#
# Usage example (caller workflow):
#
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened]
#
#   jobs:
#     check-sprint:
#       uses: Mininglamp-OSS/.github/.github/workflows/reusable-check-sprint.yml@main
#       with:
#         pr-number: ${{ github.event.pull_request.number }}
#         repo-name: ${{ github.repository }}
#         # org-login: "Mininglamp-OSS"      # default
#         # project-number: 2                 # default
#         # enforce-freshness: false  # set to true for repos with long-lived
#                                     # branches that may survive sprint rollover
#       secrets:
#         PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
#
# Status check name for branch protection: "check-sprint / check-sprint"

name: Check Sprint (reusable)

on:
  workflow_call:
    inputs:
      pr-number:
        description: "Pull request number to check"
        required: true
        type: number
      repo-name:
        description: "Full repo name (owner/repo)"
        required: true
        type: string
      org-login:
        description: "GitHub org login"
        required: false
        type: string
        default: "Mininglamp-OSS"
      project-number:
        description: "GitHub Project V2 number"
        required: false
        type: number
        default: 2
      enforce-freshness:
        description: "When true, fail if the PR head commit predates the current sprint start date"
        required: false
        type: boolean
        default: false
    secrets:
      PROJECT_TOKEN:
        description: >-
          PAT with read:project and read:org scopes (classic PAT) or
          "Projects: Read" + "Organization custom roles: Read" (fine-grained PAT).
          For private repositories, also add repo (classic) or
          "Contents: Read" + "Pull requests: Read" (fine-grained).
        required: true

jobs:
  check-sprint:
    name: check-sprint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate Sprint field on Project Board
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REPO_NAME: ${{ inputs.repo-name }}
          ORG_LOGIN: ${{ inputs.org-login }}
          PROJECT_NUMBER: ${{ inputs.project-number }}
          ENFORCE_FRESHNESS: ${{ inputs.enforce-freshness }}
        shell: bash
        run: |
          python3 - <<'PYTHON_SCRIPT'
          import json, os, sys, time, urllib.request, urllib.error
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          TOKEN = os.environ["PROJECT_TOKEN"]
          PR_NUMBER = int(os.environ["PR_NUMBER"])
          REPO_NAME = os.environ["REPO_NAME"]   # e.g. "Mininglamp-OSS/octo-server"
          REPO_OWNER, REPO_SHORT = REPO_NAME.split("/", 1)
          ORG_LOGIN = os.environ["ORG_LOGIN"]
          PROJECT_NUMBER = int(os.environ["PROJECT_NUMBER"])
          ENFORCE_FRESHNESS = os.environ.get("ENFORCE_FRESHNESS", "false").lower() == "true"

          BOARD_URL = f"https://github.com/orgs/{ORG_LOGIN}/projects/{PROJECT_NUMBER}"

          MAX_ATTEMPTS = 3


          def graphql(query: str, variables: dict = None) -> dict:
              """Call GitHub GraphQL API with retries on transient failures."""
              payload = {"query": query}
              if variables:
                  payload["variables"] = variables
              body_bytes = json.dumps(payload).encode("utf-8")

              for attempt in range(MAX_ATTEMPTS):
                  try:
                      req = urllib.request.Request(
                          "https://api.github.com/graphql",
                          data=body_bytes,
                          headers={
                              "Authorization": f"bearer {TOKEN}",
                              "Content-Type": "application/json",
                          },
                          method="POST",
                      )
                      resp = urllib.request.urlopen(req, timeout=30)
                      resp_body = resp.read().decode("utf-8")
                      http_code = resp.status

                  except urllib.error.HTTPError as e:
                      http_code = e.code
                      try:
                          resp_body = e.read().decode("utf-8")
                      except Exception:
                          resp_body = ""

                      if http_code >= 500:
                          if attempt < MAX_ATTEMPTS - 1:
                              delay = 1 * (2 ** attempt)
                              print(f"::warning::GraphQL returned HTTP {http_code} "
                                    f"(attempt {attempt+1}/{MAX_ATTEMPTS}), "
                                    f"retrying in {delay}s...")
                              time.sleep(delay)
                              continue
                          print(f"::error::GraphQL returned HTTP {http_code} after "
                                f"{MAX_ATTEMPTS} attempts ({MAX_ATTEMPTS}/{MAX_ATTEMPTS}).")
                          sys.exit(1)

                      if http_code == 401:
                          print("::error::PROJECT_TOKEN is invalid or expired")
                          sys.exit(1)
                      elif http_code == 403:
                          print("::error::PROJECT_TOKEN lacks required scopes. "
                                "Classic PAT: read:project + read:org; "
                                "Fine-grained PAT: 'Projects: Read' + "
                                "'Organization custom roles: Read'")
                          sys.exit(1)
                      elif http_code == 404:
                          print("::error::Project or repository not found. "
                                "Check org-login and project-number inputs")
                          sys.exit(1)
                      else:
                          print(f"::error::GraphQL request failed with HTTP {http_code}")
                          sys.exit(1)

                  except (urllib.error.URLError, OSError) as e:
                      if attempt < MAX_ATTEMPTS - 1:
                          delay = 1 * (2 ** attempt)
                          print(f"::warning::Network/connection error: {e} "
                                f"(attempt {attempt+1}/{MAX_ATTEMPTS}). "
                                f"Retrying in {delay}s...")
                          time.sleep(delay)
                          continue
                      print(f"::error::GraphQL request failed after {MAX_ATTEMPTS} "
                            f"attempts ({MAX_ATTEMPTS}/{MAX_ATTEMPTS}): {e}")
                      sys.exit(1)

                  try:
                      body = json.loads(resp_body)
                  except json.JSONDecodeError:
                      print(f"::error::GitHub API returned a non-JSON response "
                            f"(HTTP {http_code}). Response: {resp_body[:200]}")
                      sys.exit(1)

                  if "errors" in body:
                      msgs = "; ".join(e.get("message", str(e)) for e in body["errors"])
                      print(f"::error::GraphQL errors: {msgs}")
                      sys.exit(1)

                  return body["data"]

              print("::error::GraphQL request failed: exceeded retry limit.")
              sys.exit(1)


          def get_today_shanghai() -> date:
              """Return today's date in Asia/Shanghai (date-only, no time component)."""
              return datetime.now(ZoneInfo("Asia/Shanghai")).date()


          # --- Step 1: Determine the current sprint iteration -----------------------

          try:
              data = graphql(
                  """
                  query($orgLogin: String!, $projectNumber: Int!) {
                    organization(login: $orgLogin) {
                      projectV2(number: $projectNumber) {
                        id
                        field(name: "Sprint") {
                          ... on ProjectV2IterationField {
                            configuration {
                              iterations {
                                id
                                title
                                startDate
                                duration
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                  """,
                  variables={"orgLogin": ORG_LOGIN, "projectNumber": PROJECT_NUMBER},
              )
              project_id = data["organization"]["projectV2"]["id"]
              field = data["organization"]["projectV2"]["field"]

              if field is None:
                  print(f"::error::Sprint field not found on project #{PROJECT_NUMBER}. "
                        "Has the 'Sprint' field been renamed or removed from the Octo Board?")
                  sys.exit(1)

              iterations = field["configuration"]["iterations"]
          except (KeyError, TypeError) as e:
              print(f"::error::Failed to read Sprint iterations or project ID. "
                    "Check that PROJECT_TOKEN has read:project + read:org scope "
                    "and that the Sprint field exists on project board "
                    f"#{PROJECT_NUMBER}. Detail: {e}")
              sys.exit(1)

          today = get_today_shanghai()
          current_sprint = None

          for it in iterations:
              start = date.fromisoformat(it["startDate"])
              end = start + timedelta(days=it["duration"])
              if start <= today < end:
                  current_sprint = it
                  break

          if current_sprint is None:
              print(
                  f"::error::No active sprint covers today ({today}). "
                  "Ask the project admin to add a new iteration on the Octo Board: "
                  f"{BOARD_URL}/settings"
              )
              sys.exit(1)

          sprint_start = date.fromisoformat(current_sprint["startDate"])

          print(f"Current sprint: {current_sprint['title']} "
                f"({current_sprint['startDate']} + {current_sprint['duration']}d)")

          # --- Step 2: Get the PR's Sprint value from the project board -------------

          try:
              # IMPORTANT: fieldValueByName is case-sensitive. If the Sprint field on the
              # Octo Board is ever renamed (e.g. to "sprint" or "SPRINT"), update this query.
              pr_query = """
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    projectItems(first: 100) {
                      nodes {
                        project { id }
                        sprint: fieldValueByName(name: "Sprint") {
                          ... on ProjectV2ItemFieldIterationValue {
                            iterationId
                            title
                          }
                        }
                      }
                    }
                    commits(last: 1) {
                      nodes {
                        commit { committedDate }
                      }
                    }
                  }
                }
              }
              """
              pr_variables = {
                  "owner": REPO_OWNER,
                  "name": REPO_SHORT,
                  "number": PR_NUMBER,
              }

              data = graphql(pr_query, variables=pr_variables)
              pr = data["repository"]["pullRequest"]
              items = pr["projectItems"]["nodes"]
          except (KeyError, TypeError) as e:
              print(f"::error::Failed to read PR project data. "
                    "Check that PROJECT_TOKEN has read:project + read:org scope "
                    f"and that PR #{PR_NUMBER} exists. Detail: {e}")
              sys.exit(1)

          # --- Step 2b (optional): Enforce freshness check --------------------------

          if ENFORCE_FRESHNESS:
              # Note: committedDate reflects GIT_COMMITTER_DATE, which can be set arbitrarily
              # by the commit author. This is a UX guard against accidental cross-sprint merges,
              # not an adversarial control. For a spoofing-resistant check, use pushedDate via
              # the REST API instead, but that complexity is not warranted for this use case.
              try:
                  committed_date_str = pr["commits"]["nodes"][0]["commit"]["committedDate"]
                  committed_date = datetime.fromisoformat(
                      committed_date_str.replace("Z", "+00:00")
                  ).astimezone(ZoneInfo("Asia/Shanghai")).date()

                  if committed_date < sprint_start:
                      print(
                          "::error::PR head commit predates the current sprint. "
                          "Please rebase or push a new commit to re-evaluate "
                          "sprint membership."
                      )
                      sys.exit(1)

                  print(f"Freshness check passed: head commit date {committed_date} "
                        f">= sprint start {sprint_start}")
              except (KeyError, TypeError, IndexError) as e:
                  print(f"::error::Failed to check head commit timestamp for "
                        f"freshness enforcement. Detail: {e}")
                  sys.exit(1)

          # Find the item belonging to the configured project (match by node ID)
          board_item = None
          for item in items:
              if item["project"]["id"] == project_id:
                  board_item = item
                  break

          if board_item is None and len(items) == 100:
              print("::warning::projectItems page cap (100) reached without finding "
                    "the Octo Board item. This should never happen in practice. "
                    "Check project configuration.")

          # --- Step 3: Evaluate result ----------------------------------------------

          if board_item is None or board_item.get("sprint") is None:
              print(
                  f"::error::Sprint not set. "
                  f"Please set Sprint = {current_sprint['title']} on the Octo Board "
                  f"({BOARD_URL}), then go to Actions UI and re-run this check."
              )
              sys.exit(1)

          pr_sprint_title = board_item["sprint"]["title"]
          pr_sprint_id = board_item["sprint"]["iterationId"]

          if pr_sprint_id != current_sprint["id"]:
              print(
                  f"::error::Sprint mismatch. "
                  f"Current sprint is {current_sprint['title']}, "
                  f"but this PR's Sprint is {pr_sprint_title}. "
                  f"Please update Sprint on the Board, then re-run this check in Actions UI."
              )
              sys.exit(1)

          print(f"Sprint is correctly set to: {pr_sprint_title}")
          PYTHON_SCRIPT
