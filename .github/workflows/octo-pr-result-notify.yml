name: Octo PR Result Notify (reusable)

# Refactored (Wave 2): MAPPING (validate + sanitize + format message) stays
# here; TRANSPORT delegated to the shared octo-notify composite action.
# See docs/workflow-architecture.md Plane 6.

on:
  workflow_call:
    inputs:
      repo_name:
        type: string
        required: true
      pr_number:
        type: number
        required: true
      pr_title:
        type: string
        required: true
      pr_url:
        type: string
        required: true
      pr_author:
        type: string
        required: true
      event_kind:
        type: string
        required: true
      reviewer:
        type: string
        required: false
        default: ''
      pr_additions:
        type: number
        required: false
        default: 0
      pr_deletions:
        type: number
        required: false
        default: 0
      pr_changed_files:
        type: number
        required: false
        default: 0
      feed_group_id:
        type: string
        required: false
        default: '1c303c142e9840f2a9b46c10b0972e8d'
      api_base_url:
        type: string
        required: false
        default: 'https://im.deepminer.com.cn/api'
    secrets:
      OCTO_BOT_TOKEN:
        required: true

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build result message
        id: build
        env:
          REPO_NAME: ${{ inputs.repo_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          EVENT_KIND: ${{ inputs.event_kind }}
          REVIEWER: ${{ inputs.reviewer }}
          PR_ADDITIONS: ${{ inputs.pr_additions }}
          PR_DELETIONS: ${{ inputs.pr_deletions }}
          PR_CHANGED_FILES: ${{ inputs.pr_changed_files }}
          FEED_GROUP_ID: ${{ inputs.feed_group_id }}
        run: |
          python3 - <<'PYEOF'
          import os, re, sys

          OUT = os.environ['GITHUB_OUTPUT']
          DELIM = '__OCTO_NOTIFY_EOF_9f3a__'

          def emit(key, value):
              with open(OUT, 'a') as f:
                  f.write(f'{key}<<{DELIM}\n{value}\n{DELIM}\n')

          ALLOWED_KINDS = {
              "pr_merged", "pr_closed",
              "review_approved", "review_changes_requested",
          }

          def require_env(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  print(f"::error::Missing required env var: {name}")
                  sys.exit(1)
              return value

          def get_env(name, default=""):
              return os.environ.get(name, default).strip()

          def require_group_id(name):
              val = os.environ.get(name, '').strip()
              if not re.fullmatch(r'[0-9a-f]{32}', val or ''):
                  print(f'ERROR: {name} must be a 32-char lowercase hex group id')
                  sys.exit(2)
              return val

          def require_repo_name(name):
              val = os.environ.get(name, '').strip()
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,99}', val or '') or val in {'.', '..'}:
                  print(f'ERROR: {name} contains invalid characters: {val!r}')
                  sys.exit(2)
              return val

          def sanitize_text(s, max_len=300):
              s = str(s or '')
              s = re.sub(r'[\x00-\x1f\x7f]', ' ', s)
              return s[:max_len]

          repo_name = require_repo_name('REPO_NAME')
          pr_number = require_env("PR_NUMBER")
          pr_title = sanitize_text(require_env("PR_TITLE"))
          pr_url = require_env("PR_URL")
          pr_author = sanitize_text(require_env('PR_AUTHOR'), max_len=80)
          event_kind = require_env("EVENT_KIND")
          reviewer = sanitize_text(get_env('REVIEWER'), max_len=80)
          reviewer_display = reviewer if reviewer else "(unknown)"
          pr_additions = int(get_env("PR_ADDITIONS", "0") or "0")
          pr_deletions = int(get_env("PR_DELETIONS", "0") or "0")
          pr_changed_files = int(get_env("PR_CHANGED_FILES", "0") or "0")
          # Validate group id format (transport allowlists the API base itself).
          require_group_id("FEED_GROUP_ID")

          if event_kind not in ALLOWED_KINDS:
              print(f"::warning::Unrecognized event_kind '{event_kind}', skipping")
              emit('skip', 'true')
              sys.exit(0)

          if event_kind == "pr_merged":
              stats_part = f' · +{pr_additions} -{pr_deletions} · {pr_changed_files} files' if (pr_additions or pr_deletions or pr_changed_files) else ''
              message = (
                  f"\U0001f7e2 [{repo_name}] PR #{pr_number} merged · {pr_title}\n"
                  f"\U0001f464 {pr_author}{stats_part}\n"
                  f"\U0001f517 {pr_url}"
              )
          elif event_kind == "pr_closed":
              message = (
                  f"\U0001f534 [{repo_name}] PR #{pr_number} closed · {pr_title}\n"
                  f"\U0001f464 {pr_author}\n"
                  f"\U0001f517 {pr_url}"
              )
          elif event_kind == "review_approved":
              message = (
                  f"✅ [{repo_name}] PR #{pr_number} approved · {pr_title}\n"
                  f"\U0001f464 reviewer: {reviewer_display}\n"
                  f"\U0001f517 {pr_url}"
              )
          elif event_kind == "review_changes_requested":
              message = (
                  f"\U0001f501 [{repo_name}] PR #{pr_number} changes requested · {pr_title}\n"
                  f"\U0001f464 reviewer: {reviewer_display}\n"
                  f"\U0001f517 {pr_url}"
              )

          emit('skip', 'false')
          emit('im_message', message)
          PYEOF

      - name: Send to Octo IM
        if: steps.build.outputs.skip != 'true'
        uses: Mininglamp-OSS/.github/.github/actions/octo-notify@v1
        with:
          im-message: ${{ steps.build.outputs.im_message }}
          im-token: ${{ secrets.OCTO_BOT_TOKEN }}
          im-group-id: ${{ inputs.feed_group_id }}
          im-api-base: ${{ inputs.api_base_url }}
