# Reusable workflow: Secret Scanning (gitleaks)
#
# L1 authoritative gate of the three-layer secret-scanning model
# (see docs/workflow-architecture.md Plane 2):
#   - Platform: GitHub native push protection (free, public) — known vendor secrets
#   - L0: gitleaks in a local git hook (per-repo) — custom rules + instant feedback
#   - L1: THIS workflow — the only secret defense for fork contributors (no L0)
#
# Runs gitleaks as a pinned, SHA256-verified binary download (same supply-chain
# pattern as hadolint/actionlint in this repo). We deliberately do NOT use
# gitleaks-action: on organizations it requires a paid license key, and the CLI
# needs none for this use.
#
# On pull_request it scans only the PR commit range (fast); on push/schedule it
# scans full history. A repo may add a custom .gitleaks.toml for org-specific
# rules (e.g. OCTO_BOT_TOKEN / PROJECT_TOKEN formats) — it is auto-detected.
#
# SECURITY: scans the checked-out tree/history only; runs no project code.
#
# Usage (caller):
#   on:
#     pull_request:
#       branches: [main]
#     push:
#       branches: [main]
#   jobs:
#     secret-scan:
#       uses: Mininglamp-OSS/.github/.github/workflows/reusable-secret-scan.yml@v1
name: Reusable — Secret Scan

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: 'gitleaks version (must match the pinned SHA256 below if overridden).'
        type: string
        required: false
        default: '8.30.1'

permissions: {}

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # PRs: only the commit range is scanned (see step below), so a shallow
          # clone is enough. push/schedule: full history for a complete sweep.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Install gitleaks (pinned + SHA256-verified)
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          # Pinned to the default version. If you override gitleaks-version, update
          # this checksum to the matching linux_x64 release artifact.
          PINNED_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          if [ "$GITLEAKS_VERSION" != "$PINNED_VERSION" ]; then
            echo "::error::gitleaks-version '$GITLEAKS_VERSION' != pinned '$PINNED_VERSION'. Update the SHA256 in reusable-secret-scan.yml to change versions."
            exit 1
          fi
          TARBALL="gitleaks_${PINNED_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${TARBALL}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${PINNED_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${TARBALL}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${TARBALL}" -C "${RUNNER_TEMP}" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version

      - name: Run gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          GITLEAKS="${RUNNER_TEMP}/gitleaks"

          # Auto-detect a repo-provided config; otherwise gitleaks uses its defaults.
          config_args=()
          if [ -f .gitleaks.toml ]; then
            echo "Using repo .gitleaks.toml"
            config_args=(--config .gitleaks.toml)
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Scan only the commits introduced by the PR.
            echo "Scanning PR range ${BASE_SHA}..${HEAD_SHA}"
            "$GITLEAKS" git "${config_args[@]}" \
              --log-opts="${BASE_SHA}..${HEAD_SHA}" \
              --redact --verbose .
          else
            echo "Scanning full history"
            "$GITLEAKS" git "${config_args[@]}" --redact --verbose .
          fi
