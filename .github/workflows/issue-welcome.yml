# Reusable workflow: tag newly-opened issues with `needs-triage`.
#
# This used to post a bilingual welcome comment with hardcoded bug/feature
# copy. That overlapped with the dedicated triage agent (see octo-issue-notify's
# webhook mode), which reads the issue content and does real classification +
# triage commentary. So this workflow is now reduced to its deterministic,
# always-on job: apply a `needs-triage` label. The triage agent owns greeting,
# classification, and removing the label once triaged.
#
# Idempotent: GitHub de-dupes labels, so re-runs are harmless. Bot-opened issues
# (Dependabot, etc.) are skipped. The `needs-triage` label is created if missing.
name: Issue Welcome (Reusable)

on:
  workflow_call:

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: needs-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Apply needs-triage label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              core.setFailed('This workflow must be called from an issues event. context.payload.issue is undefined.');
              return;
            }
            // Skip bot-opened issues (Dependabot, etc.)
            // Guard against ghost/deleted user accounts where issue.user may be null.
            if (issue.user && issue.user.type === 'Bot') {
              console.log('Skipping bot-opened issue');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const LABEL = 'needs-triage';

            // Ensure the label exists (create it if missing).
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (err) {
              if (err.status === 404) {
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name: LABEL,
                    color: 'd876e3',
                    description: 'Awaiting triage',
                  });
                  console.log(`Created label "${LABEL}".`);
                } catch (e) {
                  // Another concurrent run may have created it; ignore races.
                  core.debug(`createLabel race/err: ${e.message}`);
                }
              } else {
                throw err;
              }
            }

            // Apply the label (idempotent — GitHub de-dupes).
            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels: [LABEL],
            });
            console.log(`Applied "${LABEL}" to issue #${issue.number}.`);
