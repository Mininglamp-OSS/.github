name: Reusable — CodeQL Analysis

on:
  workflow_call:
    inputs:
      language:
        description: 'CodeQL language: go or javascript-typescript'
        type: string
        required: true
      build-command:
        description: 'Optional build command before analysis (e.g. "go build ./...")'
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  analyze:
    name: CodeQL (${{ inputs.language }})
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4
        with:
          languages: ${{ inputs.language }}
          queries: security-extended
          # config-file is optional; repos can add .github/codeql/codeql-config.yml

      - name: Autobuild
        if: inputs.build-command == ''
        uses: github/codeql-action/autobuild@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4

      - name: Custom build
        if: inputs.build-command != ''
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        shell: bash
        run: eval "$BUILD_COMMAND"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: /language:${{ inputs.language }}
